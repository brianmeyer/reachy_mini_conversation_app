<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reachy Command</title>
  <style>
    :root { --bg:#0f1f1d; --panel:#fffdf8; --ink:#14211f; --muted:#5d6b68; --accent:#12a594; --line:#d9e2df; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:white; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:0; }
    main { min-height:100vh; padding:clamp(16px,4vw,34px); display:grid; grid-template-rows:auto 1fr; gap:18px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:14px; }
    h1 { margin:0; font-size:clamp(28px,5vw,54px); }
    .sub { color:#b9d4cf; font-size:16px; margin-top:5px; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-content:center; }
    .tile { min-height:150px; border-radius:8px; border:1px solid rgba(255,255,255,.2); background:var(--panel); color:var(--ink); padding:20px; display:grid; align-content:space-between; text-decoration:none; }
    .tile strong { font-size:26px; }
    .tile span { color:var(--muted); font-size:15px; line-height:1.35; }
    .tile.primary { background:var(--accent); color:white; }
    .tile.primary span { color:#e8fffb; }
    .btn { min-height:44px; border-radius:8px; border:1px solid rgba(255,255,255,.25); background:transparent; color:white; padding:0 14px; text-decoration:none; display:inline-flex; align-items:center; }
    @media (max-width:800px) { .grid { grid-template-columns:1fr 1fr; } }
    @media (max-width:520px) { .grid { grid-template-columns:1fr; } header { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Reachy</h1><div class="sub">Touchscreen command center mock for build day.</div></div>
      <a class="btn" href="/parent">Parent</a>
    </header>
    <section class="grid">
      <a class="tile primary" href="/kids"><strong>Family Board</strong><span>Chores, calendar, and today.</span></a>
      <a class="tile" href="/gallery"><strong>Gallery</strong><span>Games, drawings, generated images.</span></a>
      <a class="tile" href="/ops"><strong>Status</strong><span>Cloud, models, latency, health.</span></a>
      <a class="tile" href="/memory"><strong>Memories</strong><span>Parent review queue.</span></a>
      <a class="tile" href="/logs"><strong>Activity</strong><span>What happened recently.</span></a>
      <a class="tile" href="/family"><strong>Parent Edit</strong><span>Schedules and chore setup.</span></a>
    </section>
  </main>
</body>
</html>
