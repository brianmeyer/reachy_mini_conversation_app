<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reachy Gallery</title>
  <style>
    :root { --bg:#f5f2ea; --panel:#fffdf8; --ink:#1f2528; --muted:#667174; --line:#d7d0c5; --accent:#0f766e; --danger:#b91c1c; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:0; }
    header { border-bottom:1px solid var(--line); background:rgba(255,253,248,.94); position:sticky; top:0; z-index:2; }
    .bar, main { max-width:1240px; margin:0 auto; padding:16px 20px; }
    .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    h1 { margin:0; font-size:20px; }
    .sub { color:var(--muted); font-size:13px; margin-top:3px; }
    .nav { display:flex; flex-wrap:wrap; gap:8px; }
    .btn { min-height:38px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:0 12px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font:inherit; }
    .btn.primary { background:var(--accent); color:white; border-color:var(--accent); }
    .btn.danger { background:var(--danger); color:white; border-color:var(--danger); }
    main { display:grid; gap:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:grid; grid-template-rows:auto 1fr; }
    .preview { aspect-ratio:4/3; background:#e7e1d5; display:grid; place-items:center; overflow:hidden; }
    .preview img { width:100%; height:100%; object-fit:cover; }
    .preview iframe { width:100%; height:100%; border:0; background:white; }
    .body { padding:12px; display:grid; gap:8px; }
    .name { font-weight:800; overflow-wrap:anywhere; }
    .meta { color:var(--muted); font-size:13px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    @media (max-width:700px) { .bar { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div><h1>Reachy Gallery</h1><div class="sub">Generated games, pages, images, and shown drawings.</div></div>
      <nav class="nav">
        <a class="btn" href="/parent">Parent</a>
        <a class="btn" href="/ops">Ops</a>
        <button class="btn primary" id="refresh">Refresh</button>
      </nav>
    </div>
  </header>
  <main><section class="grid" id="grid"></section></main>
  <script>
    const grid = document.getElementById('grid');
    async function load() {
      const data = await fetch('/artifacts/list?limit=100').then(r => r.json());
      grid.innerHTML = (data.artifacts || []).map(item => {
        const preview = item.kind === 'image'
          ? `<img src="${item.url}" alt="">`
          : item.kind === 'html'
            ? `<iframe src="${item.url}" title="${item.name}"></iframe>`
            : `<span>${item.kind}</span>`;
        return `<article class="card">
          <div class="preview">${preview}</div>
          <div class="body">
            <div class="name">${item.name}</div>
            <div class="meta">${item.kind} · ${Math.round(item.bytes / 1024)} KB · ${item.modified}</div>
            <div class="actions">
              <a class="btn" href="${item.url}" target="_blank" rel="noopener">Open</a>
              <button class="btn danger" data-delete="${item.name}">Delete</button>
            </div>
          </div>
        </article>`;
      }).join('') || '<p>No artifacts yet.</p>';
    }
    grid.addEventListener('click', async (event) => {
      const name = event.target.dataset && event.target.dataset.delete;
      if (!name) return;
      if (!confirm(`Delete ${name}?`)) return;
      await fetch(`/admin/artifacts/${encodeURIComponent(name)}/delete`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({note:'Deleted from gallery'}) });
      await load();
    });
    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
